<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — D'todoReu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #F8FAFB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem;
      text-align: center;
      max-width: 360px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .emoji { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; color: #111827; margin-bottom: .5rem; }
    p  { font-size: .875rem; color: #6B7280; line-height: 1.6; margin-bottom: 1.5rem; }
    a  {
      display: inline-block;
      padding: .625rem 1.5rem;
      background: linear-gradient(135deg, #3ECF8E, #4BA8D3);
      color: white;
      border-radius: .75rem;
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📶</div>
    <h1>Sin conexión a internet</h1>
    <p>Para ver el directorio de negocios de Retalhuleu necesitas estar conectado. Verifica tu red e intenta de nuevo.</p>
    <a href="/">Reintentar</a>
  </div>
</body>
</html>
